<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookstore App</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, sans-serif;
      background: #f0f0f0;
    }
    button {
      cursor: pointer;
      padding: 10px;
      border: none;
      background: #007bff;
      color: white;
      margin: 5px;
    }
    input {
      padding: 8px;
      margin: 5px;
      border: 1px solid #ccc;
    }
    div {
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
